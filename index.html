<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compas Discoteca | Vinyl Collective</title>
  <meta name="description" content="Compas Discoteca is a vinyl collective from the Inland Empire, California.">
  <meta property="og:title" content="Compas Discoteca | Vinyl Collective">
  <meta property="og:description" content="A cornucopia of funkadelia and tropical grooves.">
  <meta property="og:image" content="https://www.compasdiscoteca.com/assets/og.png">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <main class="shop">
    <header>
      <a href="#top" class="wordmark" aria-label="Compas Discoteca home"></a>
      <a class="instagram" href="https://www.instagram.com/compasdiscoteca" target="_blank" rel="noreferrer">INSTAGRAM ↗</a>
    </header>

    <section id="top" class="crate-scene">
      <div class="intro"><h1>Vinyl Collective from the Inland Empire, California</h1></div>
      <p class="instruction"><span>↓</span> PICK A RECORD</p>

      <div class="record-nav" role="tablist" aria-label="Explore Compas Discoteca">
        <button class="record record-1" role="tab" data-section="about"><span class="vinyl-45"><i></i></span><span class="sleeve-paper"></span><span class="record-title">About</span></button>
        <button class="record record-2" role="tab" data-section="sound"><span class="vinyl-45"><i></i></span><span class="sleeve-paper"></span><span class="record-title">Our Sound</span></button>
        <button class="record record-3" role="tab" data-section="events"><span class="vinyl-45"><i></i></span><span class="sleeve-paper"></span><span class="record-title">Events</span></button>
        <button class="record record-4" role="tab" data-section="contact"><span class="vinyl-45"><i></i></span><span class="sleeve-paper"></span><span class="record-title">Contact</span></button>
        <button class="record record-5" role="tab" data-section="shop"><span class="vinyl-45"><i></i></span><span class="sleeve-paper"></span><span class="record-title">Shop</span></button>
      </div>

      <aside id="record-details" class="details" aria-live="polite"></aside>
    </section>

    <footer><span>FUNKADELIA &amp; TROPICAL GROOVES</span><span>© 2026 COMPAS DISCOTECA</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
